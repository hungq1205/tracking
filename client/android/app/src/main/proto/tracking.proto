syntax = "proto3";

package tracking;

// Android is the only client this server talks to (see CLAUDE.md's
// "Client-Orchestrated Live Session" section) — the Pi thin client,
// Mediator, Desktop operator GUI, and offline-scan workflow (and every RPC/
// message that existed only for them: MediatorService, the old MapService,
// TrackingService's Chat/VoiceChat/VoiceChatStream/StreamFrame) have been
// removed. Gemini Live orchestration runs entirely on-device now; this
// server is a pure heavy-compute + live-mapping backend.

// DetectObject/GetEmbedding stay heavy models called directly by Android's
// TrackingBackend.kt for its local-ORB-tracking init/renewal — not merged
// into PerceptionService.AnalyzeFrame since that call site predates it and
// still works unchanged.
service TrackingService {
  rpc DetectObject (DetectionRequest) returns (DetectionResponse);
  rpc GetEmbedding (EmbeddingRequest) returns (EmbeddingResponse);
}

message DetectionRequest {
  string prompt = 1;
  bytes image_data = 2;   // JPEG-encoded frame — sent per-request now that there's
                           // no continuous frame stream keeping a server-side
                           // "latest frame" warm (Gemini Live runs on-device)
}

message DetectionResponse {
  repeated float box_xyxy = 1;
  float score = 2;
}

message EmbeddingRequest {
  repeated float box_xyxy = 1;
  bytes image_data = 2;   // JPEG-encoded frame, see DetectionRequest
}

message EmbeddingResponse {
  repeated float embedding = 1;
}

// IMU measurement — used by MappingChunk.imu_samples (accepted on the wire,
// not currently consumed server-side; MappingService is RTAB-Map-pose-only).
message IMUFrame {
  int64 timestamp_ns = 1;
  float accel_x = 2;
  float accel_y = 3;
  float accel_z = 4;
  float gyro_x = 5;
  float gyro_y = 6;
  float gyro_z = 7;
}

// ─────────────────────────────────────────────────────────────────────────
// PerceptionService / MappingService
//
// Consolidated heavy-compute surface for the Android client's on-device
// Gemini Live tool-dispatch loop — see CLAUDE.md's "Client-Orchestrated
// Live Session" section.
// ─────────────────────────────────────────────────────────────────────────

// Heavy, stateless-per-call perception primitives: object detection,
// re-ID embedding, obstacle/depth estimation, neural TTS, text embedding.
service PerceptionService {
  rpc AnalyzeFrame (AnalyzeFrameRequest) returns (AnalyzeFrameResponse);
  rpc Synthesize (SynthesizeRequest) returns (stream PcmChunk);
  rpc Embed (EmbedRequest) returns (EmbedResponse);
}

enum AnalysisOp {
  DETECT = 0;         // GroundingDINO open-vocab detection (requires prompt)
  EMBED = 1;           // DINOv2 re-ID embedding (requires box_xyxy)
  DEPTH = 2;           // obstacle/depth estimate (SparseObstacleDetector/StereoDepthDetector/DA3)
  TRAVERSABILITY = 3;  // per-angle obstacle clearance fan — see TraversabilityInfo. Still used
                       // by GUIDING's local dodge layer (unchanged) — see CLAUDE.md's "Local
                       // reactive HRTF obstacle-dodge" note.
  CORRIDOR = 4;        // UNUSED — was WALKING's world-anchored-corridor-lock beacon signal,
                       // superseded by a client-side LocalPathPlanner route through a live
                       // occupancy grid (see CLAUDE.md's walking-mode local-map note). Left
                       // in place (server no longer handles it) rather than removed/renumbered
                       // — no wire-compat benefit to reclaiming the value.
}

message AnalyzeFrameRequest {
  bytes image_data = 1;          // JPEG-encoded frame
  repeated AnalysisOp ops = 2;   // which analyses to run on this one frame (one round trip)
  string prompt = 3;             // for DETECT
  repeated float box_xyxy = 4;   // for EMBED — box to embed
}

message AnalyzeFrameResponse {
  repeated Detection detections = 1;      // present if DETECT was requested
  repeated float embedding = 2;           // present if EMBED was requested
  ObstacleInfo obstacle = 3;              // present if DEPTH was requested
  TraversabilityInfo traversability = 4;  // present if TRAVERSABILITY was requested
  CorridorInfo corridor = 5;              // present if CORRIDOR was requested
}

message Detection {
  repeated float box_xyxy = 1;
  float score = 2;
  string label = 3;
}

message ObstacleInfo {
  bool detected = 1;
  float distance_m = 2;
  float angle_deg = 3;   // relative bearing, 0 = straight ahead
  string description = 4;
}

// Self-describing polar clearance fan (mirrors OccupancyGrid's own
// self-describing width/height/cell_size convention) — one nearest-obstacle
// clearance value per egocentric azimuth bin, computed fresh from THIS
// frame alone (no world state, no accumulation across frames). Azimuth 0 =
// straight ahead, positive = right, same convention as HrtfBeacon.kt.
// clearance_m[i] corresponds to azimuth (min_angle_deg + i * angle_step_deg);
// a bin with no obstacle within max_range_m reads max_range_m itself (fully
// open, not a missing value).
message TraversabilityInfo {
  repeated float clearance_m = 1;
  float min_angle_deg = 2;
  float max_angle_deg = 3;
  float angle_step_deg = 4;
  float max_range_m = 5;
  // Nearest BELOW-ground-plane (drop-off/step-down/stairs) distance per
  // bin, same shape/semantics as clearance_m — a bin with no drop-off
  // within max_range_m reads max_range_m itself. Distinct from
  // clearance_m, which only tracks points ABOVE the ground plane
  // (obstacles) — a downward step registers as neither an obstacle nor
  // ground under the old obstacle-only classification, which let a
  // staircase going down misread as a wide-open corridor. See
  // server/tools/traversability.py's _clearance_fan_from_depth() and
  // CLAUDE.md's hazard-warning note.
  repeated float dropoff_m = 6;
}

// UNUSED — see AnalysisOp.CORRIDOR's own comment. Left in place, not removed.
message CorridorInfo {
  bool found = 1;
  float azimuth_deg = 2;
  float distance_m = 3;
  float width_m = 4;
}

message SynthesizeRequest {
  string text = 1;
}

message PcmChunk {
  bytes pcm_data = 1;    // raw PCM, 24 kHz 16-bit LE mono (KokoroTTS)
}

message EmbedRequest {
  string text = 1;
}

message EmbedResponse {
  repeated float vector = 1;   // sentence-transformer (MiniLM) embedding
}

// Live SLAM-style mapping + localization, active whenever the client's
// guiding/walking mode is on (there is no separate offline "scan session"
// any more — see CLAUDE.md's "3D Scanning Pipeline" section).
service MappingService {
  rpc UpdateMapping (stream MappingChunk) returns (stream MappingUpdate);
  rpc GetMapSnapshot (GetMapSnapshotRequest) returns (MapSnapshot);
  rpc ListMappedLocations (ListMapsRequest) returns (ListMapsResponse);
  // Deferred landmark lookup: GroundingDINO never runs proactively during
  // scanning any more (see scan_server/semantic_mapper.py's module
  // docstring) — this is the only place it runs, on demand, against the
  // session's in-memory frame store (tag-match first, else a first-hit
  // scan — see scan_server/scan_session.py's resolve_landmark()). Because
  // MappingUpdate.landmarks now stays empty for the duration of an active
  // stream (real positions only exist after finalize-time export or via
  // this RPC), the Android client always resolves a guiding destination
  // through this call rather than a live-streamed landmarks list.
  rpc FindLandmark (FindLandmarkRequest) returns (FindLandmarkResponse);
}

message ListMapsRequest {}

message ListMapsResponse {
  repeated string location_ids = 1;
}

enum PoseSource {
  IMU_VO = 0;
  RTABMAP = 1;
}

message CameraIntrinsics {
  float fx = 1;
  float fy = 2;
  float cx = 3;
  float cy = 4;
}

message MappingChunk {
  string location_id = 1;
  bytes image_data = 2;                     // JPEG-encoded frame
  int64 frame_timestamp_ns = 3;              // same clock domain as imu_samples' timestamps
  repeated IMUFrame imu_samples = 4;         // IMU samples since the previous chunk
  PoseSource pose_source = 5;               // only meaningful on the first chunk of a session
  CameraIntrinsics intrinsics = 6;           // not yet consumed server-side — the mapping
                                              // pipeline still estimates K from image dimensions
                                              // (same _estimate_K fallback tools/depth.py already
                                              // uses); wiring real intrinsics through is follow-up
  SessionMode session_mode = 7;              // only meaningful on the first chunk of a stream —
                                              // see StreamingScanSession(walking_lite=...) /
                                              // ScanSession.process_frames_batch's walking_lite note
  // GUIDING only — set once ToolDispatcher.recomputeRoute() has resolved
  // guidingDestinationLabel via FindLandmark; left false for WALKING, which
  // has no destination (the server infers "keep walking forward" from its
  // own RTAB-Map pose's heading + session_mode instead — see
  // find_farthest_open_path() in live_path_planner.py). Server-side path
  // planning needs a goal it has no other way to learn (see CLAUDE.md's
  // "Server-planned walking path" note) — FindLandmark itself is unchanged,
  // this just carries its result back to the server for planning purposes.
  bool has_goal = 8;
  float goal_x = 9;
  float goal_z = 10;
}

// SCAN: full pipeline (RTAB-Map get_cloud/SOR reconstruction + VLM/semantic
// tagging) — the explicit, user-initiated "look around" pass a location's
// landmarks/semantic map get built from.
// WALKING/GUIDING: walking_lite=true — local back-projection feeds the
// occupancy map directly (no RTAB-Map get_cloud/SOR pull, no TSDF), no VLM
// tagging at all. Landmark lookups (FindLandmark) fall back to whatever a
// prior SCAN already persisted for this location_id instead of discovering
// anything live. See CLAUDE.md's "Client-Orchestrated Live Session" section.
enum SessionMode {
  SCAN = 0;
  WALKING = 1;
  GUIDING = 2;
}

message Pose {
  float x = 1;
  float y = 2;
  float z = 3;
  float qx = 4;
  float qy = 5;
  float qz = 6;
  float qw = 7;
}

// Flattened row-major grid (rows=Z, cols=X), cell (ix, iz) at index
// ix + iz*width — mirrors occupancy_map.py's _build_grid_dict()/
// extract_full_grid() schema exactly (same field names/semantics), so the
// server side is a direct, untranslated pass-through of that dict.
message OccupancyGrid {
  int32 width = 1;
  int32 height = 2;
  float origin_x = 3;      // world X of cell (0, 0)
  float origin_z = 4;      // world Z of cell (0, 0)
  float cell_size = 5;     // metres per cell (occupancy_map.py's `resolution`)
  repeated int32 cls = 6;          // 0=unknown, 1=ground, 2=low/step-over, 3=obstacle
  repeated float height_norm = 7;  // 0.0=ground, (0,1]=normalized obstacle height, -1.0=unknown (same sentinel as occupancy_map.py's `data`)
  repeated float clearance_m = 8;  // metres to nearest obstacle cell
}

message Landmark {
  string name = 1;
  float x = 2;
  float z = 3;
  float confidence = 4;
}

message PathPoint {
  float x = 1;
  float z = 2;
}

// A server-planned walking route, computed against the live occupancy grid
// (server-side only now — see CLAUDE.md's "Server-planned walking path"
// note) via scan_server/live_path_planner.py's LiveGridPathPlanner. Android
// no longer runs its own A* — it steers the HRTF beacon toward a
// look-ahead point that walks along `points`, bridging the gap between
// updates with its own rotation/PDR estimate (see ToolDispatcher.kt).
message PlannedPath {
  repeated PathPoint points = 1;  // world (x, z); empty == no walkable path found (dead end)
  bool confirmed = 2;             // false if the route crossed any CLASS_UNKNOWN cell
  bool reached_exactly = 3;       // false == GUIDING's closest-approach fallback, or
                                   // WALKING's farthest-open-direction pick (never an exact goal)
}

// One changed occupancy cell, addressed by GLOBAL grid index (ix, iz) — NOT
// relative to any particular window/row/col — so indices stay valid across
// deltas even as the map's overall bounding box grows between full resyncs.
// See occupancy_map.py's extract_dirty_delta() and CLAUDE.md's "Occupancy
// grid delta sync" note for the full design (why clearance can go briefly
// stale for a cell near, but not touched by, the change that dirtied it).
message OccupancyCellUpdate {
  int32 ix = 1;
  int32 iz = 2;
  int32 cls = 3;           // same 0..3 convention as OccupancyGrid.cls
  float height_norm = 4;   // same convention as OccupancyGrid.height_norm
  float clearance_m = 5;
}

message OccupancyGridDelta {
  float resolution = 1;             // == OccupancyGrid.cell_size of the last full grid this patches
  repeated OccupancyCellUpdate cells = 2;
}

message MappingUpdate {
  Pose pose = 1;
  OccupancyGrid grid = 2;          // FULL grid — only set when full_resync is true
  bool grid_updated = 3;           // mirrors occupancy_map.py's _update_count gating — false means
                                    // "pose only, neither grid nor grid_delta carries new data"
  repeated Landmark landmarks = 4; // stays EMPTY for the duration of an active stream now —
                                    // GroundingDINO/backprojection is deferred (see FindLandmark
                                    // RPC below); only populated in the final snapshot after
                                    // finalize-time export runs at stream end
  float confidence = 5;            // this update's depth-consistency confidence [0,1]
  OccupancyGridDelta grid_delta = 6; // incremental cell patch — set when grid_updated is true AND
                                    // full_resync is false (the common case after the first update)
  bool full_resync = 7;            // true the first time a location streams this session, or
                                    // whenever the map's bounding box itself grew — client must
                                    // replace its whole local grid from `grid`, not patch it
  // True on the one update where a pure-walking (SessionMode.WALKING)
  // session's consecutive-RTAB-Map-tracking-loss streak crossed the
  // "completely lost, no sign of recovery" threshold and the session was
  // reset (RTAB-Map + pose state cleared, same as a fresh stream). Only
  // ever set for WALKING — GUIDING/SCAN leave this false. The client must
  // drop any corridor lock computed against the now-discarded pose history
  // — see CLAUDE.md's walking-mode corridor-lock note.
  bool reset_occurred = 8;
  // Echoes MappingChunk.frame_timestamp_ns for whichever chunk this update
  // was computed from — the client's latency-compensation buffer (see
  // ToolDispatcher.kt / CLAUDE.md's "Server-planned walking path" note)
  // looks up its own locally-estimated pose AT that send time, so it can
  // fast-forward this (already slightly stale, by network + RTAB-Map/DA3
  // processing latency) `pose` by however much local motion it estimates
  // happened since then.
  int64 frame_timestamp_ns = 9;
  // Server-planned route for this update's pose — see PlannedPath's own
  // docstring. Replaces the old design where Android streamed the
  // occupancy grid (`grid`/`grid_delta` above) and ran its own A* locally.
  PlannedPath planned_path = 10;
}

message GetMapSnapshotRequest {
  string location_id = 1;
}

message MapSnapshot {
  bool found = 1;
  OccupancyGrid grid = 2;
  repeated Landmark landmarks = 3;
}

message FindLandmarkRequest {
  string location_id = 1;
  string query = 2;         // free-text destination/object name, e.g. "the wardrobe", "water bottle"
}

message FindLandmarkResponse {
  bool found = 1;
  float x = 2;
  float z = 3;
  float confidence = 4;
  string matched_label = 5; // the resolved landmark's own name/label (may differ from `query`)
}

// StatusService — the server has no other way to know what mode the client
// is in (no server-side session/LiveSessionState any more — orchestration
// runs on Android, see CLAUDE.md's "Client-Orchestrated Live Session"
// section). ToolDispatcher.kt calls ReportMode once per LiveSessionState.mode
// transition purely so server_gui.py's dashboard can display/select the
// correct tab directly instead of inferring it from whichever RPC category
// last happened to fire — this RPC carries no data any other service needs.
service StatusService {
  rpc ReportMode (ReportModeRequest) returns (ReportModeResponse);
  // Dashboard-only, fire-and-forget, same precedent as ReportMode above —
  // carries no data any other service needs. The server has no other way
  // to learn the beacon's actual final azimuth: goal-biasing + EMA
  // smoothing now happen client-side (see ToolDispatcher's local-avoidance
  // tick), so server_gui.py can't reconstruct it from the raw
  // TraversabilityInfo fan alone. Called once per avoidance tick while
  // walking/guiding is active.
  rpc ReportBeaconDirection (ReportBeaconDirectionRequest) returns (ReportBeaconDirectionResponse);
  // Called once, right after a fresh connection is established (see
  // MainViewModel.connect()) — the server otherwise has no way to
  // distinguish "a genuinely new client session is starting" from "this
  // same client is still going, just calling another RPC." Clears every
  // accumulated server-side scan/mapping session (all location_ids) and
  // resets the shared RTAB-Map docker session, so a new connection never
  // silently resumes a stale map/pose left over from a previous one.
  rpc ResetSession (ResetSessionRequest) returns (ResetSessionResponse);
}

message ReportModeRequest {
  string mode = 1;    // "idle" | "reading" | "tracking" | "guiding" | "walking" | "scanning"
  string target = 2;  // trackingTarget / guidingDestinationLabel / readingLabel, whichever applies — else ""
}

message ReportModeResponse {}

message ReportBeaconDirectionRequest {
  float azimuth_deg = 1;  // meaningless when muted=true
  bool muted = 2;
}

message ReportBeaconDirectionResponse {}

message ResetSessionRequest {}
message ResetSessionResponse {}
